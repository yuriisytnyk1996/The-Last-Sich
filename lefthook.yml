# Git hooks (https://lefthook.dev). Installed automatically by `pnpm install`.

pre-commit:
  commands:
    file-sizes:
      glob: "*.gd"
      run: tools/check_file_sizes.sh
    eslint:
      glob: "*.{js,mjs,ts,mts}"
      run: node_modules/.bin/eslint {staged_files}
    gdlint:
      glob: "*.gd"
      run: gdlint {staged_files} && gdformat --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}
